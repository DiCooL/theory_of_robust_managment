<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img"><title>Схема управления для стенда</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:Arial,"DejaVu Sans",sans-serif}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.ts{font-size:12px;fill:#444441}
.t{font-size:14px;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.3;fill:none}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
</style>
<rect x="0" y="0" width="680" height="100%" fill="#FFFFFF"/>
<text class="ts" x="140" y="26" text-anchor="middle">α_d(t) и её производные</text>
<line x1="140" y1="34" x2="140" y2="54" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="60" y="56" width="160" height="48" rx="6" stroke-width="0.6"/><text class="th" x="140" y="72" text-anchor="middle" dominant-baseline="central">Регулятор</text><text class="ts" x="140" y="90" text-anchor="middle" dominant-baseline="central">прямая связь + ПД</text></g>
<line x1="220" y1="80" x2="248" y2="80" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="250" y="56" width="110" height="48" rx="6" stroke-width="0.6"/><text class="th" x="305" y="72" text-anchor="middle" dominant-baseline="central">Насыщение</text><text class="ts" x="305" y="90" text-anchor="middle" dominant-baseline="central">|M| ≤ 1.13 Н·м</text></g>
<line x1="360" y1="80" x2="388" y2="80" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="390" y="56" width="100" height="48" rx="6" stroke-width="0.6"/><text class="th" x="440" y="72" text-anchor="middle" dominant-baseline="central">Моторы</text><text class="ts" x="440" y="90" text-anchor="middle" dominant-baseline="central">τ = 50 мс</text></g>
<line x1="490" y1="80" x2="518" y2="80" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="575" y="26" text-anchor="middle">возмущение w</text>
<line x1="575" y1="34" x2="575" y2="54" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="520" y="56" width="110" height="48" rx="6" stroke-width="0.6"/><text class="th" x="575" y="72" text-anchor="middle" dominant-baseline="central">Стенд</text><text class="ts" x="575" y="90" text-anchor="middle" dominant-baseline="central">α, ω = dα/dt</text></g>
<path d="M600 104 L600 244 L562 244" class="arr" marker-end="url(#arrow)"/>
<line x1="600" y1="174" x2="562" y2="174" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="400" y="150" width="160" height="48" rx="6" stroke-width="0.6"/><text class="th" x="480" y="166" text-anchor="middle" dominant-baseline="central">Камера + YOLOv8</text><text class="ts" x="480" y="184" text-anchor="middle" dominant-baseline="central">30 Гц, задержка 50 мс</text></g>
<g class="c-purple"><rect x="400" y="220" width="160" height="48" rx="6" stroke-width="0.6"/><text class="th" x="480" y="236" text-anchor="middle" dominant-baseline="central">Гироскоп</text><text class="ts" x="480" y="254" text-anchor="middle" dominant-baseline="central">задержка 4 мс</text></g>
<path d="M400 174 L160 174 L160 106" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="280" y="166" text-anchor="middle">α_изм = α + шум 0.45°</text>
<path d="M400 244 L120 244 L120 106" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="280" y="236" text-anchor="middle">ω_изм = ω + шум 0.19°/с</text>
<rect x="200" y="290" width="280" height="44" rx="6" fill="none" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="ts" x="340" y="312" text-anchor="middle" dominant-baseline="central">Внутренний контур MFC отключён</text>
</svg>
