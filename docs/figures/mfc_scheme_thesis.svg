<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img"><title>Схема MFC из ВКР</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:Arial,"DejaVu Sans",sans-serif}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.ts{font-size:12px;fill:#444441}
.t{font-size:14px;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.3;fill:none}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
</style>
<rect x="0" y="0" width="680" height="100%" fill="#FFFFFF"/>
<text class="ts" x="30" y="72">r</text>
<line x1="40" y1="80" x2="68" y2="80" class="arr" marker-end="url(#arrow)"/>
<circle cx="80" cy="80" r="10" fill="none" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="ts" x="88" y="106">−</text>
<line x1="90" y1="80" x2="118" y2="80" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="120" y="56" width="150" height="48" rx="6" stroke-width="0.6"/><text class="th" x="195" y="72" text-anchor="middle" dominant-baseline="central">Регулятор ū</text><text class="ts" x="195" y="90" text-anchor="middle" dominant-baseline="central">компенсация + ПД</text></g>
<line x1="270" y1="80" x2="298" y2="80" class="arr" marker-end="url(#arrow)"/>
<circle cx="310" cy="80" r="10" fill="none" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="ts" x="318" y="106">−</text>
<line x1="320" y1="80" x2="448" y2="80" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="420" y="72">M</text>
<g class="c-gray"><rect x="450" y="56" width="170" height="48" rx="6" stroke-width="0.6"/><text class="th" x="535" y="72" text-anchor="middle" dominant-baseline="central">Стенд</text><text class="ts" x="535" y="90" text-anchor="middle" dominant-baseline="central">крен α</text></g>
<line x1="620" y1="80" x2="662" y2="80" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="650" y="72">y</text>
<line x1="390" y1="80" x2="390" y2="138" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="330" y="140" width="120" height="48" rx="6" stroke-width="0.6"/><text class="th" x="390" y="156" text-anchor="middle" dominant-baseline="central">Фильтр</text><text class="ts" x="390" y="174" text-anchor="middle" dominant-baseline="central">T/(s+T), u_fil</text></g>
<line x1="390" y1="188" x2="390" y2="238" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="372" y="232">−</text>
<circle cx="390" cy="250" r="10" fill="none" stroke="#5F5E5A" stroke-width="0.8"/>
<path d="M640 80 L640 250 L622 250" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="470" y="226" width="150" height="48" rx="6" stroke-width="0.6"/><text class="th" x="545" y="242" text-anchor="middle" dominant-baseline="central">Обратная модель</text><text class="ts" x="545" y="260" text-anchor="middle" dominant-baseline="central">û = 2μ·dα/dt</text></g>
<line x1="470" y1="250" x2="402" y2="250" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="408" y="244">+</text>
<path d="M380 250 L310 250 L310 92" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="296" y="180" text-anchor="end">Δu</text>
<path d="M640 250 L640 310 L80 310 L80 92" class="arr" marker-end="url(#arrow)"/>
</svg>
