[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-mfc"
version = "0.1.0"
description = "Roll-channel control of a quadcopter on a gyroscopic test bench by model feedback control (Narikiyo)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["uav_mfc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
